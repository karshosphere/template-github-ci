name: ci

# pull_request rather than pull_request_target, so a fork's code never runs with this repository's secrets
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # pull requests share a group per branch so newer pushes replace older runs; each commit on main
  # gets its own group, since a pending run in a shared group is dropped and its tag would be skipped
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=node-version depName=node
  NODE_VERSION: 24.22.0
  # renovate: datasource=npm depName=@devcontainers/cli
  DEVCONTAINER_CLI_VERSION: 0.89.0

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # full history, so every existing release tag is available to compare against
          fetch-depth: 0
      - name: VERSION holds a single vX.Y.Z version
        run: |
          grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' VERSION && [ "$(grep -c "" VERSION)" -eq 1 ] || {
            echo "::error file=VERSION::VERSION must be one line of the form vX.Y.Z"
            exit 1
          }
      - name: VERSION is higher than every release tag
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          latest=$(git tag --list --sort=-v:refname | { grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' || true; } | sed -n 1p)
          if [ -n "$latest" ]; then
            highest=$(printf '%s\n' "$latest" "$version" | sort -V | tail -n 1)
            if [ "$version" = "$latest" ] || [ "$highest" != "$version" ]; then
              echo "::error file=VERSION::VERSION is $version but $latest is already released; bump it above $latest"
              exit 1
            fi
          fi

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: run.sh is present and executable
        run: |
          [ -x run.sh ] || {
            echo "::error file=run.sh::run.sh is missing or not executable"
            exit 1
          }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global "@devcontainers/cli@$DEVCONTAINER_CLI_VERSION"
      - name: Start the dev container
        run: devcontainer up --workspace-folder .
      - name: Format
        run: devcontainer exec --workspace-folder . ./run.sh --format-dry-run
      - name: Build
        run: devcontainer exec --workspace-folder . ./run.sh --build
      - name: Test
        run: devcontainer exec --workspace-folder . ./run.sh --test

  tag:
    if: github.event_name == 'push'
    needs: [version, checks]
    runs-on: ubuntu-24.04
    permissions:
      # creates the tag named in VERSION on the merged commit
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: echo "tag=$(tr -d "[:space:]" < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            await github.rest.git.createRef({ ...context.repo, ref: `refs/tags/${process.env.TAG}`, sha: context.sha });
            core.notice(`Tagged ${context.sha} as ${process.env.TAG}`);
